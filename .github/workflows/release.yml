# Release = ondertekende tag "v*" op een commit die op main staat. Strengste compliance-check,
# bewijsbundel (10 jaar bewaren i.v.m. productaansprakelijkheid) met build-attestatie, daarna een
# aparte deploy-job naar Vercel via de beschermde environment "production" (handmatige goedkeuring).
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash # bash -eo pipefail: een falende stap in een pipe laat de job falen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag moet op main staan
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test 2>&1 | tee test-uitvoer.txt
      - run: npm run typecheck
      - run: npm run build
      - run: npm run compliance:release
      - run: npm run sbom
      - name: Bewijsbundel samenstellen
        run: |
          mkdir -p bewijs
          cp test-uitvoer.txt sbom.cdx.json package-lock.json compliance/register.yaml compliance/third-parties.json bewijs/
          cp compliance/reports/compliance-*.md bewijs/
          cp -r compliance/incidents docs/qa bewijs/
          (cd apps/web/dist && find . -type f -exec sha256sum {} \; | sort -k2) > bewijs/site-hashes.txt
          {
            echo "tag: ${GITHUB_REF_NAME}"
            echo "commit: ${GITHUB_SHA}"
            echo "datum: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "node: $(node -v)"
          } > bewijs/MANIFEST.txt
          zip -r "bewijs-${GITHUB_REF_NAME}.zip" bewijs
          (cd apps/web/dist && zip -r "../../../site-${GITHUB_REF_NAME}.zip" .)
      # Attestatie: bewijst dat deze zips door deze workflow uit deze commit zijn gebouwd. De deploy- en
      # noodstop-jobs deployen alleen een site-zip waarvan de attestatie klopt.
      # Werkt in openbare repo's (en met GitHub Enterprise). Zet de variabele ATTESTATION=off zolang de repo privé is;
      # verify-release.sh valt dan terug op herkomst via tag en uploader (zie ADR-0011).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ vars.ATTESTATION != 'off' }}
        with:
          subject-path: |
            site-${{ github.ref_name }}.zip
            bewijs-${{ github.ref_name }}.zip
      - name: GitHub Release met bewijs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "bewijs-${GITHUB_REF_NAME}.zip" "site-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes

  # Aparte job op een schone runner: geen npm-dependencies van de repo, alleen het geattesteerde artefact,
  # de vastgepinde Vercel CLI (eigen lockfile, --ignore-scripts) en onze eigen scripts zonder dependencies.
  deploy:
    needs: release
    if: ${{ vars.VERCEL_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency: { group: vercel-productie, cancel-in-progress: false } # nooit tegelijk met de noodstop
    permissions:
      contents: read
      attestations: read
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      ATTESTATION: ${{ vars.ATTESTATION }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      # Scripts en vercel.json van main (vertrouwd, via PR gereviewd); alleen het artefact komt uit de release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Artefact ophalen en herkomst controleren
        run: scripts/verify-release.sh "$GITHUB_REF_NAME"
      - name: Noodstop niet stil opheffen
        if: ${{ env.SITE_URL != '' }}
        run: |
          live=$(curl -fsS "$SITE_URL/status.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).blocked===true))' || echo false)
          nieuw=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("site/status.json","utf8")).blocked===true)')
          if [ "$live" = "true" ] && [ "$nieuw" != "true" ]; then
            echo "::error::De noodstop staat live AAN. Zet status.json in de repo bewust op uit (of gebruik de noodstop-workflow) voordat je released."
            exit 1
          fi
      - run: npm ci --prefix tools/vercel-cli --ignore-scripts
      # Productie-build zonder domein (--skip-domain), testen op de eigen URL, dan direct promoveren: wat getest is,
      # gaat live (geen herbouw zoals bij het promoveren van een preview).
      - name: Deployen, testen, promoveren
        run: |
          node scripts/vercel-output.mjs site
          url=$(tools/vercel-cli/node_modules/.bin/vercel deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN")
          node scripts/smoke-headers.mjs "$url"
          tools/vercel-cli/node_modules/.bin/vercel promote "$url" --yes --token "$VERCEL_TOKEN"
      - name: Rooktest productie (wacht tot de nieuwe versie live is)
        if: ${{ env.SITE_URL != '' }}
        run: node scripts/smoke-headers.mjs "$SITE_URL" --retries=12
