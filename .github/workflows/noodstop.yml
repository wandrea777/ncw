# Noodstop: zet de app binnen enkele minuten uit (of weer aan) zonder nieuwe code te releasen.
# Neemt de site van een release (standaard de laatste), controleert de herkomst (scripts/verify-release.sh), past alleen
# status.json aan en deployt die naar Vercel, met de headers en scripts van main (nooit code van de tag).
# Start via GitHub → Actions → Noodstop → Run workflow (werkt ook vanaf je telefoon in de GitHub-app).
name: Noodstop
on:
  workflow_dispatch:
    inputs:
      stand:
        description: "aan of uit"
        required: true
        type: choice
        options: [aan, uit]
      bericht:
        description: "Tekst voor gebruikers (bij aan)"
        required: false
        default: "We onderzoeken een probleem. Probeer het later opnieuw."
      tag:
        description: "Release-tag (leeg = laatste release), bijv. v0.2.0"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  noodstop:
    runs-on: ubuntu-latest
    environment: noodstop # alleen vanaf main (branch-policy); bewust zonder wachttijd
    concurrency: { group: vercel-productie, cancel-in-progress: false } # nooit tegelijk met een release
    permissions:
      contents: read
      attestations: read
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      ATTESTATION: ${{ vars.ATTESTATION }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      # Code van main (vertrouwd). De code van de release-tag draait hier nooit: alleen de gecontroleerde site-zip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Release bepalen en controleren
        env:
          TAG: ${{ inputs.tag }}
        run: |
          t="${TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          scripts/verify-release.sh "$t"
      - name: status.json zetten
        env:
          STAND: ${{ inputs.stand }}
          BERICHT: ${{ inputs.bericht }}
        run: |
          node -e 'const b=process.env.STAND==="aan";require("fs").writeFileSync("site/status.json",JSON.stringify({blocked:b,message:b?process.env.BERICHT:""}))'
          cat site/status.json
      - name: Deployen, testen, promoveren
        if: ${{ env.VERCEL_PROJECT_ID != '' }}
        run: |
          npm ci --prefix tools/vercel-cli --ignore-scripts
          node scripts/vercel-output.mjs site
          url=$(tools/vercel-cli/node_modules/.bin/vercel deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN")
          node scripts/smoke-headers.mjs "$url" ${{ inputs.stand == 'aan' && '--expect-blocked' || '' }}
          tools/vercel-cli/node_modules/.bin/vercel promote "$url" --yes --token "$VERCEL_TOKEN"
      - name: Wachten tot de noodstop live staat
        if: ${{ env.VERCEL_PROJECT_ID != '' && env.SITE_URL != '' }}
        run: node scripts/smoke-headers.mjs "$SITE_URL" --retries=12 ${{ inputs.stand == 'aan' && '--expect-blocked' || '' }}
