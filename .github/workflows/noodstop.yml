# Noodstop: zet de tool binnen ~1 minuut uit (of weer aan) zonder nieuwe code te releasen.
# Neemt de site van de laatste release, past alleen status.json aan en deployt die.
# Start via GitHub → Actions → Noodstop → Run workflow (werkt ook vanaf je telefoon in de GitHub-app).
name: Noodstop
on:
  workflow_dispatch:
    inputs:
      stand:
        description: "aan of uit"
        required: true
        type: choice
        options: [aan, uit]
      bericht:
        description: "Tekst voor gebruikers (bij aan)"
        required: false
        default: "We onderzoeken een probleem. Probeer het later opnieuw."
permissions:
  contents: read
jobs:
  noodstop:
    runs-on: ubuntu-latest
    environment: noodstop  # alleen vanaf main; bewust zonder wachttijd
    steps:
      - name: Laatste releasesite ophalen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "site-*.zip" --output site.zip
          mkdir site && cd site && unzip -q ../site.zip
      - name: status.json zetten
        env:
          STAND: ${{ inputs.stand }}
          BERICHT: ${{ inputs.bericht }}
        run: |
          node -e 'const b=process.env.STAND==="aan";require("fs").writeFileSync("site/status.json",JSON.stringify({blocked:b,message:b?process.env.BERICHT:""}))'
          cat site/status.json
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
